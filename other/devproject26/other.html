// ── Old Groups ─────────────────────────────────────────────────────────────
function renderOldGroups() {
  const s = window._state;
  const oldGroups = [...s.groups.filter(g => g.status === 'completed')]
    .sort((a, b) => (b.groupNumber || 0) - (a.groupNumber || 0));

  let html = `<div class="page-header">
      <div><h2>Old Groups</h2><div class="subtitle">${oldGroups.length} completed testing cycle${oldGroups.length !== 1 ? 's' : ''}</div></div>
      ${refreshControlHtml('groups', 'apps', 'users')}
    </div>
    <div class="section"><div class="groups-grid">`;

  if (oldGroups.length === 0) html += '<div class="empty">No completed groups yet</div>';
  oldGroups.forEach(g => { html += oldGroupCardHtml(g); });

  html += '</div></div>';
  document.getElementById('view-oldgroups').innerHTML = html;
}

// Total cycle length from Phase 1 start to Phase 3 review deadline.
// Mirrors PHASE_1_DURATION_DAYS + CHECKIN_A_DURATION_DAYS + PHASE_2_DURATION_DAYS
// + CHECKIN_B_DURATION_DAYS + PHASE_3_DURATION_DAYS from constants.ts (3+2+3+2+3).
// Update this if those constants change.
const CYCLE_TOTAL_DAYS = 13;

function oldGroupEndDate(group) {
  // Cycle start = timerStartedAt (Phase 0B lock / handshake = start of Phase 1)
  if (!group.timerStartedAt) return null;
  const startMs = group.timerStartedAt.seconds * 1000;
  const endMs = startMs + CYCLE_TOTAL_DAYS * 24 * 60 * 60 * 1000;
  return { seconds: Math.floor(endMs / 1000) };
}

function oldGroupCardHtml(g) {
  const totalMembers = g.memberUids?.length || 0;
  const survivedMembers = g.activeMemberUids?.length || 0;
  const evictedCount = totalMembers - survivedMembers;
  const endDate = oldGroupEndDate(g);
  const isExpanded = window._state.expandedOldGroups.has(g.groupId);

  return `<div class="group-card">
    <div class="group-card-header" onclick="toggleOldGroup('${g.groupId}')">
      <div class="group-number">${g.groupNumber}</div>
      <div class="group-info">
        <h3>Group #${g.groupNumber}</h3>
        <div class="meta">${totalMembers} total member${totalMembers !== 1 ? 's' : ''}${evictedCount > 0 ? ` · ${evictedCount} evicted along the way` : ''} · Started ${ts(g.createdAt)}</div>
      </div>
      <div class="group-badges">
        <span class="badge badge-completed">Completed</span>
        <span class="collapse-icon ${isExpanded ? 'open' : ''}" id="icon-old-${g.groupId}">▼</span>
      </div>
    </div>
    <div style="padding:10px 16px;display:flex;gap:20px;align-items:center;border-bottom:1px solid #f0f0f0;font-size:12px;color:#888;">
      <span>Start: <strong style="color:#333;">${ts(g.createdAt)}</strong></span>
      <span>Phase 1 start: <strong style="color:#333;">${g.timerStartedAt ? ts(g.timerStartedAt) : '—'}</strong></span>
      <span>Cycle end: <strong style="color:#333;">${endDate ? ts(endDate) : '—'}</strong></span>
      <span style="margin-left:auto;">${survivedMembers}/${totalMembers} completed the full cycle</span>
    </div>
    <div class="group-body ${isExpanded ? 'open' : ''}" id="old-body-${g.groupId}">
      ${isExpanded ? oldGroupBodyHtml(g) : ''}
    </div>
  </div>`;
}

window.toggleOldGroup = function(groupId) {
  const body = document.getElementById('old-body-' + groupId);
  const icon = document.getElementById('icon-old-' + groupId);
  if (!body) return;
  const isOpen = window._state.expandedOldGroups.has(groupId);
  if (isOpen) {
    window._state.expandedOldGroups.delete(groupId);
    body.classList.remove('open');
    body.innerHTML = '';
  } else {
    window._state.expandedOldGroups.add(groupId);
    const g = window._state.groups.find(g => g.groupId === groupId);
    if (g) body.innerHTML = oldGroupBodyHtml(g);
    body.classList.add('open');
  }
  if (icon) icon.classList.toggle('open', !isOpen);
};

function oldGroupBodyHtml(g) {
  const apps = (g.appIds || []).map(id => window._state.apps[id]).filter(Boolean);
  const evictedUids = (g.memberUids || []).filter(uid => !(g.activeMemberUids || []).includes(uid));

  const rows = apps.map(app => {
    const wasEvicted = evictedUids.includes(app.ownerUid);
    return `<tr>
      <td>${app.iconUrl ? `<img src="${app.iconUrl}" style="width:24px;height:24px;border-radius:5px;object-fit:cover;vertical-align:middle;margin-right:6px;">` : ''}<strong>${app.appName || app.packageName}</strong></td>
      <td style="font-size:12px;color:#888;">${app.packageName}</td>
      <td><span class="uid-chip" onclick="copyToClipboard('${app.ownerUid}')">${shortUid(app.ownerUid)}</span></td>
      <td>${wasEvicted ? '<span class="tag-evicted">Evicted</span>' : '<span class="tag-active-member">Completed</span>'}</td>
      <td style="text-align:right;"><button class="btn btn-ghost" style="font-size:11px;padding:3px 8px;" onclick="showUserDetail('${app.ownerUid}','${g.groupId}')">View</button></td>
    </tr>`;
  }).join('');

  return `<table class="members-table">
    <thead><tr><th>App</th><th>Package</th><th>Owner</th><th>Status</th><th></th></tr></thead>
    <tbody>${rows || '<tr><td colspan="5" style="text-align:center;color:#aaa;padding:16px;">No apps found</td></tr>'}</tbody>
  </table>`;
}

// ── Single Tests ───────────────────────────────────────────────────────────
function boostBadge(app) {
  const t = Number(app.boostTier) || 0;
  if (t >= 3) return '<span class="badge" style="background:#fde68a;color:#92400e;">⭐ Boost L2</span>';
  if (t === 2) return '<span class="badge" style="background:#fde68a;color:#92400e;">⭐ Boost L2</span>';
  if (t === 1) return '<span class="badge" style="background:#fef3c7;color:#a16207;">✨ Boost L1</span>';
  return '<span class="badge badge-gray">Normal</span>';
}

function boostExpiryBar(app) {
  const t = Number(app.boostTier) || 0;
  if (t === 0 || !app.boostExpiresAt) return '';

  const expiresMs = app.boostExpiresAt.seconds * 1000;
  const submittedMs = app.submittedAt?.seconds ? app.submittedAt.seconds * 1000 : null;
  const nowMs = Date.now();

  const remainingMs = expiresMs - nowMs;
  const remainingH = remainingMs / 3600000;

  if (remainingMs <= 0) {
    return `<div style="padding:8px 16px;border-bottom:1px solid #f0f0f0;">
      <div style="font-size:11px;color:#dc2626;font-weight:600;">⏱ Boost expired</div>
    </div>`;
  }

  // Total duration: prefer submittedAt→expiresAt span if available (covers
  // both submission-time boosts and later purchases), fall back to just
  // showing remaining time without a bar if we can't compute a span.
  const totalMs = submittedMs ? (expiresMs - submittedMs) : null;
  const pct = totalMs && totalMs > 0 ? Math.max(0, Math.min(100, ((totalMs - remainingMs) / totalMs) * 100)) : null;

  const remainingLabel = remainingH < 24 ? `${remainingH.toFixed(0)}h left` : `${(remainingH/24).toFixed(1)}d left`;
  const barColor = remainingH < 24 ? '#dc2626' : remainingH < 72 ? '#d97706' : '#22a06b';

  return `<div style="padding:8px 16px;border-bottom:1px solid #f0f0f0;">
    <div style="display:flex;justify-content:space-between;font-size:11px;color:#888;margin-bottom:3px;">
      <span>Boost active</span><span>${remainingLabel}</span>
    </div>
    ${pct !== null ? `<div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${barColor};"></div></div>` : ''}
  </div>`;
}

function renderSingleTests() {
  const s = window._state;
  const apps = [...s.singleTestApps];

  // Sort: boostTier desc (2, 1, 0), then submittedAt desc within each tier
  // Legacy boostTier 3 (removed from the product, see constants.ts) is
  // treated as equivalent to today's tier 2 for display purposes.
  const tierOf = (a) => {
    const t = Number(a.boostTier) || 0;
    return t >= 3 ? 2 : t;
  };
  apps.sort((a, b) => {
    const tierDiff = tierOf(b) - tierOf(a);
    if (tierDiff !== 0) return tierDiff;
    return (b.submittedAt?.seconds || 0) - (a.submittedAt?.seconds || 0);
  });

  const totalSuccess = s.singleTestSubmissions.filter(sub => sub.submissionType === 'success').length;
  const totalFailed = s.singleTestSubmissions.filter(sub => sub.submissionType === 'failed').length;
  const hiddenCount = apps.filter(a => a.hiddenAt).length;

  let html = `<div class="page-header">
      <div><h2>Single Tests</h2><div class="subtitle">${apps.length} apps · ${totalSuccess} successful tests · ${totalFailed} failed reports${hiddenCount ? ` · ${hiddenCount} hidden` : ''}</div></div>
      ${refreshControlHtml('singleTestApps', 'singleTestSubmissions', 'users')}
    </div>
    <div class="section"><div class="groups-grid">`;

  if (apps.length === 0) html += '<div class="empty">No single test apps yet</div>';

  let lastTier = undefined;
  apps.forEach(app => {
    const tier = tierOf(app);
    if (tier !== lastTier) {
      const tierLabel = tier === 2 ? '⭐ Boost Level 2' : tier === 1 ? '✨ Boost Level 1' : 'Normal (no boost)';
      html += `<div class="section-title" style="margin-top:${lastTier === undefined ? '0' : '8px'};">${tierLabel}</div>`;
      lastTier = tier;
    }
    html += singleTestAppCardHtml(app);
  });

  html += '</div></div>';
  document.getElementById('view-singletests').innerHTML = html;
}

function singleTestAppCardHtml(app) {
  const appSubs = window._state.singleTestSubmissions.filter(sub => sub.singleTestAppId === app.id);
  const successSubs = appSubs.filter(sub => sub.submissionType === 'success').sort((a,b) => (b.submittedAt?.seconds||0) - (a.submittedAt?.seconds||0));
  const failedSubs = appSubs.filter(sub => sub.submissionType === 'failed').sort((a,b) => (b.submittedAt?.seconds||0) - (a.submittedAt?.seconds||0));
  const isExpanded = window._state.expandedSingleTestApps.has(app.id);

  return `<div class="group-card" style="${app.hiddenAt ? 'border-color:#fca5a5;' : ''}">
    <div class="group-card-header" style="cursor:default;">
      ${app.iconUrl ? `<img src="${app.iconUrl}" style="width:36px;height:36px;border-radius:8px;object-fit:cover;flex-shrink:0;" alt="">` : '<div class="group-number">?</div>'}
      <div class="group-info">
        <h3>${app.appName || app.packageName}</h3>
        <div class="meta">${app.packageName} · Submitted ${ts(app.submittedAt)}</div>
      </div>
      <div class="group-badges">
        ${boostBadge(app)}
        ${app.hiddenAt ? '<span class="badge badge-alert">Hidden</span>' : ''}
      </div>
    </div>
    ${boostExpiryBar(app)}
    <div style="padding:10px 16px;display:flex;gap:16px;align-items:center;border-bottom:1px solid #f0f0f0;">
      <span class="uid-chip" style="background:#d1fae5;color:#065f46;cursor:pointer;" onclick="toggleSingleTestRow('${app.id}','success')">
        ✅ ${successSubs.length} successful
      </span>
      <span class="uid-chip" style="background:#fee2e2;color:#991b1b;cursor:pointer;" onclick="toggleSingleTestRow('${app.id}','failed')">
        🔴 ${failedSubs.length} failed
      </span>
      ${app.consecutiveFailedReports > 0 ? `<span style="font-size:11px;color:#d97706;">⚠ ${app.consecutiveFailedReports} consecutive fails</span>` : ''}
      <span style="margin-left:auto;font-size:11px;color:#aaa;">Reward: ${app.creditRewardPerTest ?? '—'} credits/test</span>
    </div>
    <div class="group-body ${isExpanded ? 'open' : ''}" id="st-body-${app.id}">
      ${isExpanded ? singleTestSubmissionsHtml(app.id) : ''}
    </div>
  </div>`;
}

window.toggleSingleTestRow = function(appId, type) {
  const body = document.getElementById('st-body-' + appId);
  if (!body) return;
  const isOpen = window._state.expandedSingleTestApps.has(appId);
  if (isOpen) {
    window._state.expandedSingleTestApps.delete(appId);
    body.classList.remove('open');
    body.innerHTML = '';
  } else {
    window._state.expandedSingleTestApps.add(appId);
    body.innerHTML = singleTestSubmissionsHtml(appId);
    body.classList.add('open');
  }
};

function singleTestSubmissionsHtml(appId) {
  const appSubs = [...window._state.singleTestSubmissions.filter(sub => sub.singleTestAppId === appId)]
    .sort((a,b) => (b.submittedAt?.seconds||0) - (a.submittedAt?.seconds||0));

  if (appSubs.length === 0) return '<div class="empty">No submissions yet</div>';

  const rows = appSubs.map(sub => {
    const tester = window._state.users[sub.testerUid];
    const testerLabel = tester?.displayName || tester?.email || shortUid(sub.testerUid);
    const isSuccess = sub.submissionType === 'success';
    const key = isSuccess
      ? (sub.playStoreReviewLeft ? '⭐ Play Store review left' : '')
      : (sub.failureReason || '');
    return `<tr>
      <td>${isSuccess ? '✅' : '🔴'}</td>
      <td style="font-size:12px;">${testerLabel}</td>
      <td style="font-size:12px;color:#888;">${ts(sub.submittedAt)}</td>
      <td style="font-size:12px;">${key}</td>
      <td style="font-size:12px;">+${sub.creditsAwarded ?? 0} cr</td>
      <td><button class="btn btn-ghost" style="font-size:11px;padding:2px 8px;" onclick="showSingleTestSubmissionDetail('${sub.id}')">View</button></td>
    </tr>`;
  }).join('');

  return `<table class="members-table">
    <thead><tr><th></th><th>Tester</th><th>Date</th><th>Key info</th><th>Reward</th><th></th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

window.showSingleTestSubmissionDetail = function(subId) {
  const sub = window._state.singleTestSubmissions.find(s => s.id === subId);
  if (!sub) return;
  const app = window._state.singleTestApps.find(a => a.id === sub.singleTestAppId);
  const tester = window._state.users[sub.testerUid];
  const testerLabel = tester?.displayName || tester?.email || shortUid(sub.testerUid);
  const isSuccess = sub.submissionType === 'success';

  let html = `<div class="detail-header"><h3>${isSuccess ? '✅ Successful test' : '🔴 Failed test'} — ${app?.appName || sub.singleTestAppId}</h3><button class="close-btn" onclick="closeDetail()">✕</button></div>
  <div class="detail-body">
    <div class="detail-section"><h4>Info</h4>
      <div class="kv-row"><span class="k">Tester</span><span class="v">${testerLabel}</span></div>
      <div class="kv-row"><span class="k">App</span><span class="v">${app?.appName || sub.singleTestAppId}</span></div>
      <div class="kv-row"><span class="k">Submitted</span><span class="v">${ts(sub.submittedAt)}</span></div>
      <div class="kv-row"><span class="k">Credits awarded</span><span class="v">+${sub.creditsAwarded ?? 0}</span></div>
    </div>`;

  if (isSuccess) {
    html += `<div class="detail-section"><h4>Feedback</h4>
      ${sub.reviewText ? `<div class="kv-row" style="flex-direction:column;align-items:flex-start;gap:4px;"><span class="k">Written feedback</span><span class="v" style="text-align:left;max-width:100%;font-weight:400;line-height:1.5;">${sub.reviewText}</span></div>` : ''}
      ${sub.playStoreReview ? `<div class="kv-row" style="flex-direction:column;align-items:flex-start;gap:4px;"><span class="k">Play Store review</span><span class="v" style="text-align:left;max-width:100%;font-weight:400;line-height:1.5;">${sub.playStoreReview}</span></div>` : ''}
      <div class="kv-row"><span class="k">Left a Play Store review</span><span class="v">${sub.playStoreReviewLeft ? 'Yes' : 'No'}</span></div>
    </div>`;
  } else {
    html += `<div class="detail-section"><h4>Failure details</h4>
      <div class="kv-row"><span class="k">Reason</span><span class="v">${sub.failureReason || '—'}</span></div>
      ${sub.failureComment ? `<div class="kv-row" style="flex-direction:column;align-items:flex-start;gap:4px;"><span class="k">Comment</span><span class="v" style="text-align:left;max-width:100%;font-weight:400;line-height:1.5;">${sub.failureComment}</span></div>` : ''}
    </div>`;
  }

  if (sub.screenshotUrl) {
    html += `<div class="detail-section"><h4>Screenshot</h4>
      <div class="screenshot-thumb"><img src="${sub.screenshotUrl}" alt="Screenshot" onclick="openScreenshot('${sub.screenshotUrl}')" title="Click to enlarge" style="width:100px;height:100px;"></div>
    </div>`;
  }

  html += '</div>';
  document.getElementById('detailPanel').innerHTML = html;
  document.getElementById('detailOverlay').style.display = 'flex';
};

// ── Detail overlays ────────────────────────────────────────────────────────
function findSubmissionById(subId) {
  // Feedback page loads the full global list; Group detail only loads this
  // group's slice. Check both so the same click handler works from either page.
  const globalHit = window._state.submissions.find(s => s.id === subId);
  if (globalHit) return globalHit;
  for (const groupSubs of Object.values(window._state.submissionsByGroup)) {
    const hit = groupSubs.find(s => s.id === subId);
    if (hit) return hit;
  }
  return null;
}

window.showSubmissionDetail = function(subId) {
  const sub = findSubmissionById(subId);
  if (!sub) return;
  const targetApp = window._state.apps[sub.appId];
  const tApp = Object.values(window._state.apps).find(a => a.ownerUid === sub.testerUid);
  const phLabel = sub.phase == 1.5 ? 'Quick Test A' : sub.phase == 2.5 ? 'Quick Test B' : `Phase ${sub.phase}`;
  const isAdminSkip = (sub.testingObstaclesComment || '').startsWith('[admin]');
  const obstacles = Array.isArray(sub.testingObstacles) ? sub.testingObstacles.filter(Boolean) : [];
  const fields = [
    ['firstImpressions','First impressions'],['bugsAndCrashes','Bugs & crashes'],
    ['initialSuggestions','Initial suggestions'],['coreFeatureFeedback','Core feature feedback'],
    ['bugsAndPerformance','Bugs & performance'],['improvementSuggestions','Improvement suggestions'],
    ['whatYouLikedBest','Liked best'],['polishingNotes','Polish notes'],['playStoreReview','Play Store review'],
    ['testingObstaclesComment','Testing obstacles / skip reason (comment)'],
  ];
  const filledFields = fields.filter(([k]) => sub[k]);
  let html = `<div class="detail-header"><h3>${isAdminSkip ? '🟢 ' : ''}${phLabel} — ${targetApp?.appName || sub.appId}</h3><button class="close-btn" onclick="closeDetail()">✕</button></div>
  <div class="detail-body">
    ${isAdminSkip ? `<div style="background:#d1fae5;border:1px solid #6ee7b7;border-radius:8px;padding:10px 12px;margin-bottom:16px;font-size:12px;color:#065f46;">🟢 Admin-approved skip — counted as a completed task (no mutual install, or partner didn't test back).</div>` : ''}
    <div class="detail-section"><h4>Info</h4>
      <div class="kv-row"><span class="k">Tester</span><span class="v">${tApp?.appName || shortUid(sub.testerUid)}</span></div>
      <div class="kv-row"><span class="k">App reviewed</span><span class="v">${targetApp?.appName || sub.appId}</span></div>
      <div class="kv-row"><span class="k">Phase</span><span class="v">${phLabel}</span></div>
      <div class="kv-row"><span class="k">Submitted</span><span class="v">${ts(sub.submittedAt)}</span></div>
      <div class="kv-row"><span class="k">Group</span><span class="v">${sub.groupId}</span></div>
    </div>
    ${obstacles.length > 0 ? `<div class="detail-section"><h4>Testing obstacles (selected)</h4>${obstacles.map(o => `<span class="badge badge-alert" style="margin-right:4px;margin-bottom:4px;display:inline-block;">${o}</span>`).join('')}</div>` : ''}
    <div class="detail-section"><h4>Feedback</h4>
      ${filledFields.map(([k,label]) => `<div class="kv-row" style="flex-direction:column;align-items:flex-start;gap:4px;"><span class="k">${label}</span><span class="v" style="text-align:left;max-width:100%;font-weight:400;line-height:1.5;">${sub[k]}</span></div>`).join('') || (obstacles.length > 0 ? '<div style="color:#aaa;font-size:13px;">No written comment — see obstacles above.</div>' : (sub.phase == 1.5 || sub.phase == 2.5) ? `<div style="color:#aaa;font-size:13px;">✓ Quick Test check-in — confirms the app is still installed and working. No written feedback is collected at this step.</div>` : '<div style="color:#aaa;font-size:13px;">No feedback fields</div>')}
    </div>
  </div>`;
  document.getElementById('detailPanel').innerHTML = html;
  document.getElementById('detailOverlay').style.display = 'flex';
};

window.showUserDetail = async function(uid, groupId) {
  document.getElementById('detailPanel').innerHTML = '<div class="loading"><div class="spinner"></div>Loading…</div>';
  document.getElementById('detailOverlay').style.display = 'flex';
  const submissionsPromise = groupId ? ensureSubmissionsForGroup(groupId) : ensureSubmissions();
  await Promise.all([ensureUsers(), submissionsPromise, ensureApps()]);

  const user = window._state.users[uid];
  const userApps = Object.values(window._state.apps).filter(a => a.ownerUid === uid);
  const subsPool = groupId ? (window._state.submissionsByGroup[groupId] || []) : window._state.submissions;
  const subs = subsPool.filter(s => s.testerUid === uid && s.groupId === groupId);
  let html = `<div class="detail-header"><h3>User ${shortUid(uid)}</h3><button class="close-btn" onclick="closeDetail()">✕</button></div>
  <div class="detail-body">
    <div class="detail-section"><h4>Profile</h4>
      <div class="kv-row"><span class="k">UID</span><span class="v"><span class="uid-chip" onclick="copyToClipboard('${uid}')">${uid}</span></span></div>
      ${user?.email ? `<div class="kv-row"><span class="k">Email</span><span class="v">${user.email}</span></div>` : ''}
      ${user?.displayName ? `<div class="kv-row"><span class="k">Name</span><span class="v">${user.displayName}</span></div>` : ''}
      <div class="kv-row"><span class="k">FCM token</span><span class="v">${user?.fcmToken ? '✅ set' : '❌ none'}</span></div>
    </div>
    <div class="detail-section"><h4>Apps</h4>
      ${userApps.map(a => `<div class="kv-row"><span class="k">${a.appName}</span><span class="v badge ${a.status==='completed'?'badge-completed':a.status==='evicted'?'badge-alert':'badge-active'}">${a.status}</span></div>`).join('') || '<div style="color:#aaa;font-size:13px;">None</div>'}
    </div>
    <div class="detail-section"><h4>Submissions in this group (${subs.length})</h4>
      ${subs.map(s => {
        const phLabel = s.phase==1.5?'QT-A':s.phase==2.5?'QT-B':`P${s.phase}`;
        const targetApp = window._state.apps[s.appId];
        return `<div class="kv-row"><span class="k">${phLabel} → ${targetApp?.appName||s.appId}</span><span class="v" style="font-size:11px;font-weight:400;">${ts(s.submittedAt)}</span></div>`;
      }).join('') || '<div style="color:#aaa;font-size:13px;">None</div>'}
    </div>
  </div>`;
  document.getElementById('detailPanel').innerHTML = html;
  document.getElementById('detailOverlay').style.display = 'flex';
};

window.closeDetail = function(e) {
  if (!e || e.target === document.getElementById('detailOverlay')) {
    document.getElementById('detailOverlay').style.display = 'none';
  }
};

window.showConversation = function(groupId, uidA, uidB) {
  const appA = Object.values(window._state.apps).find(a => a.ownerUid === uidA && a.groupId === groupId);
  const appB = Object.values(window._state.apps).find(a => a.ownerUid === uidB && a.groupId === groupId);
  const nameA = appA?.appName || shortUid(uidA);
  const nameB = appB?.appName || shortUid(uidB);

  const msgs = window._state.messages
    .filter(m => m.groupId === groupId &&
      ((m.senderUid === uidA && m.recipientUid === uidB) || (m.senderUid === uidB && m.recipientUid === uidA)))
    .sort((a, b) => (a.sentAt?.seconds || 0) - (b.sentAt?.seconds || 0));

  const bubbles = msgs.map(m => {
    const isA = m.senderUid === uidA;
    const senderName = isA ? nameA : nameB;
    const isDeleted = !!m.deletedAt;
    const align = isA ? 'flex-start' : 'flex-end';
    const bg = isA ? '#f0f0f5' : '#ede9fe';
    const textColor = isA ? '#1a1a1a' : '#4c1d95';
    return `<div style="display:flex;flex-direction:column;align-items:${align};margin-bottom:10px;">
      <div style="font-size:10px;color:#999;margin-bottom:2px;padding:0 4px;">${senderName} · ${ts(m.sentAt)}${m.readAt ? ' · read' : ''}</div>
      <div style="max-width:85%;background:${bg};color:${textColor};padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.5;${isDeleted ? 'font-style:italic;color:#aaa;' : ''}">
        ${isDeleted ? 'Message deleted' : (m.text ? m.text.replace(/</g,'&lt;').replace(/>/g,'&gt;') : '')}
        ${!isDeleted && m.screenshotUrl ? `<div class="screenshot-thumb" style="margin-top:6px;"><img src="${m.screenshotUrl}" alt="Screenshot" onclick="openScreenshot('${m.screenshotUrl}')" title="Click to enlarge" style="width:80px;height:80px;"></div>` : ''}
      </div>
    </div>`;
  }).join('');

  let html = `<div class="detail-header"><h3>${nameA} ↔ ${nameB}</h3><button class="close-btn" onclick="closeDetail()">✕</button></div>
  <div class="detail-body">
    <div class="detail-section" style="margin-bottom:0;">
      <h4>${msgs.length} message${msgs.length !== 1 ? 's' : ''}</h4>
      <div style="display:flex;flex-direction:column;padding-top:8px;">
        ${bubbles || '<div style="color:#aaa;font-size:13px;">No messages</div>'}
      </div>
    </div>
  </div>`;
  document.getElementById('detailPanel').innerHTML = html;
  document.getElementById('detailOverlay').style.display = 'flex';
};

window.openScreenshot = function(url, caption) {
  document.getElementById('screenshotImg').src = url;
  const capEl = document.getElementById('screenshotCaption');
  if (caption) {
    capEl.textContent = caption;
    capEl.style.display = 'block';
  } else {
    capEl.style.display = 'none';
  }
  document.getElementById('screenshotOverlay').classList.add('open');
};

window.closeScreenshot = function(e) {
  if (!e || e.target === document.getElementById('screenshotOverlay') || e.target.classList.contains('sc-close')) {
    document.getElementById('screenshotOverlay').classList.remove('open');
    document.getElementById('screenshotImg').src = '';
    document.getElementById('screenshotCaption').style.display = 'none';
  }
};
</script>
</body>
</html>
