# Languages each app's legal pages (privacy policy, terms) are published in.
# English is the base file (e.g. testcircle/privacy.md); every other language
# is the same name with -<code> (e.g. testcircle/privacy-fr.md), where <code>
# is the app's language code (the "-fr" suffix the app adds to the link).
#
# To add a language for an app:
#   1. create its <page>-<code>.md files next to the English ones
#      (front matter "lang: <code>", same {% include legal_languages.html %}
#      line at the top as the English page),
#   2. add one line below. Every page of that app then shows the new link.
# Names are written in their own language.

testcircle:
  - code: en
    name: English
  - code: fr
    name: Français
  - code: de
    name: Deutsch
  - code: es
    name: Español
  - code: it
    name: Italiano
  - code: pl
    name: Polski
  - code: pt
    name: Português
  - code: tr
    name: Türkçe
  - code: ar
    name: العربية
  - code: id
    name: Bahasa Indonesia
  - code: vi
    name: Tiếng Việt
  - code: ja
    name: 日本語
  - code: ko
    name: 한국어
  - code: zh
    name: 简体中文
